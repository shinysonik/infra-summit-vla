# VLA policy training / fine-tuning (Hugging Face LeRobot).
# Owned by: feature/policy-training
# Consumed by: /policy
#
# Training hardware is unconstrained by the brief -- this config may run on a
# GPU laptop or a rented cloud instance. Only the exported IR has to reach the
# Intel machine.

# OPEN QUESTION (PRD 7.1): smolvla | pi0.5 | act. Team decision, not a default
# to be silently picked by an implementation session.
base_policy: null
pretrained_checkpoint: null

dataset:
  # OPEN QUESTION (PRD 7.2): self-collected MuJoCo teleop vs an existing
  # LeRobot dataset close enough to fine-tune from.
  repo_id: null              # LeRobot dataset id, or null when using local data
  root: data/lerobot
  episodes: null             # null = all

training:
  seed: 0
  batch_size: 8
  learning_rate: 1.0e-4
  num_steps: 100000
  checkpoint_every: 5000
  output_dir: outputs/policy

# Export path consumed by /inference. Must stay in sync with configs/inference.yaml.
export:
  onnx_path: outputs/export/policy.onnx
  openvino_ir_dir: outputs/export/openvino
  opset: 17
