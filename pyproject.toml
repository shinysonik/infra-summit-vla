# Dependency manifest for the Python side of the project.
#
# Deliberately minimal: the PRD requires pinned, reproducible dependencies, but
# pinning happens once each module knows what it actually imports. Populate the
# optional-dependencies groups as /sim, /policy, /inference and /eval land, then
# generate a lockfile -- do not hand-maintain a second requirements.txt that can
# drift from this file.
#
# No [build-system] yet: the modules are not importable packages until they have
# real code. Add one (and __init__.py files) in the branch that needs it.

[project]
name = "infra-summit-vla"
version = "0.1.0"
description = "Bimanual VLA manipulation with multi-modal reasoning on dual SO-101 arms in MuJoCo, optimized with OpenVINO for Intel Core Ultra."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# MuJoCo scene + domain randomization (feature/mujoco-scene)
sim = []

# LeRobot fine-tuning / distillation, ONNX export (feature/policy-training)
# Training only -- not needed on the Intel demo machine.
policy = []

# OpenVINO runtime, IR conversion (feature/openvino-inference)
# This is the group that must install cleanly on the Intel Core Ultra machine.
inference = []

# Eval harness + Intel benchmark (feature/eval-benchmark)
eval = []

# Lint, format, test
dev = []
